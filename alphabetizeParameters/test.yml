trigger: none
pr: none

resources:
  repositories:
    - repository: AzureTerraform
      type: git
      name: CPT/AzureTerraformState

variables:
  - group: 'Azure account provisioning Full variable list'
  - name: AZURE_TENANT
    value: "beta"

stages:
  - stage: createazuresubscription
    displayName: Create Azure Subscription
    variables:
    - template: /variables/${{ variables.AZURE_TENANT }}.yml

    jobs:
      - template: templates/validate-inputs.yml
        parameters: #19-0
          AgentPool: $(PROVISIONING_AGENT_POOL)
          CloudRegionParam: $(CLOUD_PROVIDER_REGION)
          JobName: "ValidateInputs"
          IsBeta: ${{ variables.isBeta}}
          azureSubscriptionBackFill: ${{ variables.azureSubscriptionBackFill }}
          AzureGroupSyncService: ${{ variables.azureGroupSyncService }}
          StorageAccountName: $(STORAGE_NAME)
          ReadySubscriptionName: $(READY_SUBSCRIPTION_NAME)
          UserProvidedSubscriptionName: $(USER_PROVIDED_SUBSCRIPTION_NAME)
          SubscriptionId: $(SUBSCRIPTION_ID)
          SubscriptionEmail: $(SUBSCRIPTION_EMAIL)
          Portfolio: $(PORTFOLIO)
          Solution: $(SOLUTION)
          ServiceNowOwnerGroup: $(SERVICE_NOW_OWNER_GROUP)
          SigninEmail: $(MS_SIGNIN_EMAIL)
          Lane: $(LANE)
          UseNonProdKeyVault: $(USE_NON_PROD_KEY_VAULT)
          DestinationTenant: $(AZURE_TENANT)
          ServiceConnectionName: ${{ variables.azureSubscriptionServiceConnectionName }}

      - template: templates/get-variables-from-key-vault.yml
        parameters: #6-1
          AgentPool: $(PROVISIONING_AGENT_POOL)
          JobName: "AzureKeyVault"
          ServiceConnectionName: $(KEY_VAULT_SERVICE_CONNECTION)
          UseNonProdKeyVault: $(USE_NON_PROD_KEY_VAULT)
          DestinationTenant: $(AZURE_TENANT)
          DependsOn:
            - ValidateInputs 

      - template: templates/request-jwt.yml
        parameters: #6-1
          AgentPool: $(PROVISIONING_AGENT_POOL)
          JobName: "RequestJwt"
          OAuthUrl: $[ dependencies.AzureKeyVault.outputs['OUTPUT.OKTA_OAUTH_URL'] ]
          OAuthClientId: $[ dependencies.AzureKeyVault.outputs['OUTPUT.OKTA_OAUTH_CLIENT_ID'] ]
          OAuthClientSecret: $[ dependencies.AzureKeyVault.outputs['OUTPUT.OKTA_OAUTH_CLIENT_SECRET'] ]
          DependsOn:
            - AzureKeyVault

      - template: templates/get-variables-for-customer.yml
        parameters: #5-2
          JobName: "CustomerVariables"
          BaseUrl: $[ dependencies.AzureKeyVault.outputs['OUTPUT.CUSTOMER_VARIABLES_BASE_URL'] ]
          IdToken: $[ dependencies.RequestJwt.outputs['OUTPUT.ID_TOKEN'] ]
          DefaultParentOu: $(DefaultParentOu)
          DependsOn:
            - AzureKeyVault
            - RequestJwt

      - template: templates/send-event-job.yml
        parameters: #7-3
          JobName: SendEvent1
          DisplayName: "(STATUS Setting Subscription ID)"
          IdToken: $[ dependencies.RequestJwt.outputs['OUTPUT.ID_TOKEN'] ]
          Url: $[ dependencies.AzureKeyVault.outputs['OUTPUT.PIPELINE_EVENTS_URL'] ]
          EventsId: $[ dependencies.CustomerVariables.outputs['OUTPUT.EVENTS_ID'] ]
          Message: "SUBSCRIPTION_ID!!$(SUBSCRIPTION_ID)" 
          DependsOn:
            - RequestJwt
            - AzureKeyVault
            - CustomerVariables

        # Base64 encode the Azure DevOps token (PAT)
      - template: templates/base64.yml ########################################################### SUBSCRIPTION REGION 
        parameters: #4-1
          AgentPool: $(PROVISIONING_AGENT_POOL)
          JobName: "base64"
          DependsOn:
            - AzureKeyVault
          AccessToken: $[ dependencies.AzureKeyVault.outputs['OUTPUT.DEVOPS_TOKEN'] ]

