# EP - Test pipeline to run job templates
# This example pipeline calls the template from the templates directory in the same repo or in devops_pipelines
# To call the template from a different repo use the resources block
###########################################################################################################################
# Lines that should be caught 24, 30, 49, 88, 126, 146, 167, 217, 237, 274, 294, 341, 361, 383
###########################################################################################################################
trigger:
- none

resources:
  repositories:
    - repository: CodeRepository
      type: git
      name: ALM/java-template-testing
      ref: 'master' # The code branch should always be master

stages:
# ************************************
# ***** Stage Maven_Build *****
# ************************************

- stage: cf_push_deploy_1
  jobs:
  - template: ../cloudfoundry-deploy/cf-deploy-job.yml
    parameters:
  condition: always()

- stage: Artifactory_Java_Build_alm_agent_8
  jobs:
  - template: templates/azure-java-mvn-docker.yml@almtemplates
    parameters:
      # AppName: 'Docker-Mikes'
      JavaVersion: '11' # Values can be 11 or 8. Default maven version is 11
      ArtifactoryServiceConnection: 'Mikes' # Required. Not on all projects yet. Artifactory service connection
      SonarServiceConnection: 'SonarServiceConnection'
      ArtifactoryExtDockerRegistry: 'DockerServiceConnection'
      RunMavenSonarScan: 'true'
      MavenGoal: 'clean deploy' # Optional
      targetResolveReleaseRepo: 'mvn' # Optional
      targetResolveSnapshotRepo: 'mvn'# Optional
      targetDeployReleaseRepo: 'mvn-local-ics-releases'# Optional
      targetDeploySnapshotRepo: 'mvn-local-ics-snapshots'# Optional
      AppVersion: '1.0'
      agent: 'alm agent 8'
  condition: always()

- stage: MarkLogic_Build
  jobs:
  - template: ../marklogic/marklogic-build.yml
    parameters:
      AgentDemands: 'Docker'
      checkout: CodeRepository
      ContentsVars: 
        Variable1: "**/*.jar"
        Variable2: "**/manifest*.yml"
        Variable3: "**/pom.xml"
        Variable4: "**/*.xar"
      JavaVersion: '11' # Values can be 11 or 8. Default maven version is 11
      MavenGoal: '--batch-mode clean install -e -U' # Optional
      MavenPomFile: 'pom.xml'
      # MavenPomPath: '.' # Location of Maven pom file
      XarProfile: '${{ variables.profile }}'

- stage: MarkLogic_Deploy
  jobs:
  - template: ../marklogic/marklogic-deploy.yml
    parameters:
      ArtifactPath: '${{ variables.artifactPath }}'
      BuildType: 'current'
      checkout: CodeRepository
      XarFilePath: '${{ variables.targetPath }}/${{ variables.XarArtifactPath }}/${{ variables.ZipFilePattern }}'
      test: '${{ variables.targetPath }}/${{ variables.XarArtifactPath }}/'
      JavaVersion: '11' # Values can be 11 or 8. Default maven version is 11
      MavenGoal: '--batch-mode xar:deploy' # Optional
      MavenPomFile: 'pom.xml'
      MavenPomPath: '.' # Location of Maven pom file
      Pipeline: '$(Build.DefinitionName)' # https://docs.microsoft.com/en-us/azure/devops/pipelines/build/variables?view=azure-devops&tabs=yaml
      Project: '$(System.TeamProject)'    # https://docs.microsoft.com/en-us/azure/devops/pipelines/build/variables?view=azure-devops&tabs=yaml
      SpecificBuildWithTriggering: true
      TargetPath: '${{ variables.TargetPath }}'
      XarArtifactPath: '${{ variables.XarArtifactPath }}'
      XarFileName: '${{ variables.XarFileName }}'
      DeployCommand: 'xcc://deployment:deployment@l12870.ldschurch.org:8010'
      #Profile: '${{ variables.profile }}'

- stage: Artifactory_Java_Build_alm_agent_9
  jobs:
  - template: templates/azure-java-mvn-docker.yml@almtemplates
    parameters:
      AppName: 'Docker-Mikes'
      Portfolio: 'ESM'
      JavaVersion: '11' # Values can be 11 or 8. Default maven version is 11
