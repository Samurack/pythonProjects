- stage: cf_push_deploy_1
  jobs:
  - template: ../cloudfoundry-deploy/cloudfoundry-deploy.yml
    parameters:
      additionalDeployArgs: '--version'
      artifactName: 'drop'
      buildType: 'specific'
      buildVersion: 'latest' # Default 'latest'. Specifies what build version to download e.g. latest, specific, or latestFromBranch
      environment: 'staging'
      ManifestPath: '/drop/manifests/manifest-test.yml' # Optional. Default to drop folder.
      #org: 'ESM'
      pipeline: '4360'
      pool: 'Private Linux'
      ArtifactProject: '$(System.TeamProject)'    # https://docs.microsoft.com/en-us/azure/devops/pipelines/build/variables?view=azure-devops&tabs=yaml
      runUnzipTask: false
      space: 'alm-test'
      specificBuildWithTriggering: true
      targetPath: '$(Pipeline.Workspace)' # Directory to download the artifact files to.
      ZipFilePattern: '**/*.zip'
      checkout: CodeRepository
  condition: always()

