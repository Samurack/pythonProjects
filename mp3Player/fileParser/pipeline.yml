- stage: 'Dot_Net_Core_Build_1'
  jobs:
  - job: 
    displayName: dotnetCore_build_1 
    condition: always()
    pool:
        name: Default
    steps:
    - checkout: 'dotnetCode' # Prevent code check out
      clean: true

    - template: ../.netcore-build/.netcore-build.yml
      parameters:
        DotNetVersion: '3.x'
        BuildConfiguration: release
        DownloadSecureFile: 'false'
        RunArtifactoryUpload: 'true'
        ProjectPaths: 'pipelines-dotnet-core.sln'
        TestPaths: 'tests\*.csproj'
        RunTests: true
        PublishWebProjects: true
        ZipAfterPublish: false
        SonarScan: true
        ArtifactoryServiceConnection: 'ALM Artifactory Internal'
        SonarServiceConnection: 'ALM Sonar'
        SonarProjectKey: 'DR-dotnetcore-test-2'

