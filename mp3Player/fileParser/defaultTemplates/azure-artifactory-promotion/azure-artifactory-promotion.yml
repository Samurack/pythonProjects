#####################################
# Repo: devops_pipelines/templates
# File: azure-pipelines.yml
#####################################
resources:
  repositories:
    - repository: templates
      type: git
      name: ALM/devops_pipelines
      ref: refs/tags/azure-artifactory-promotion2.x.x                        #tag reference for a specific version of the template we want to use.
  
  
- stage: Build
  jobs:
  - template: azure-artifactory-promotion/azure-artifactory-promotion.yml@templates
    parameters:
      # Optional ArtifactoryServiceConnection: 'ALM Artifactory Internal'   #Default internal Artifactory service connection created by the ALM Team
      # Optional BuildName: '$(Build.DefinitionName)'                       #Default value is set by the variable '$(Build.DefinitionName)'
      # Optional BuildNumber: '$(Build.BuildNumber)'                        #Default value is set by the variable '$(Build.Number)'
      # Optional checkout: 'none'                                           #for more information please see https://confluence.churchofjesuschrist.org/display/ALM/Pipeline+checkout+feature
      # Optional KeepCopyInSource: 'true'                                   #Default value is true. Leave a copy in the source repository.
      # Optional PromotionStatus: 'Released'                                #Default Released
      # Optional SourceRepo: 'builds-shared-nonprod'                        #Default Internal shared repository for uploading build dependencies
      # Optional TargetRepo: 'builds-shared-prod'                           #Default Internal shared repository for uploading build dependencies
